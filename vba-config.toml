[general]
# Develop against the visible -dev workbook. Never watch/import the loaded .xlam.
file = 'MORFunctions-dev.xlsm'
vba_directory = 'vba-files'
verbose = true
in_file_headers = true
keep_open = true
encoding = 'utf-8'
# Mamba env for Office COM/xlwings/watchers (project SSoT). Not the Excel end-user runtime.
python_env = 'xlpy'
